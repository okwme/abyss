<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="abyss">
  <!-- The mark: the Well, full bleed on a 100-unit tile (docs/brand/brand.md).
       Fills are the public ramp at hue 215, surface to floor.
       The centre stays empty and dark. Never add a highlight there.
       The app draws the same geometry live (crates/app/src/ui/mark.rs); the
       app icon is this shape on Apple's icon grid, rendered by render.swift. -->
  <defs>
    <clipPath id="tile"><rect width="100" height="100" rx="22.5"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="#DDEBEE"/>
    <rect x="10" y="12" width="80" height="80" rx="18" fill="#93B1B9"/>
    <rect x="19" y="23" width="62" height="62" rx="14" fill="#517C87"/>
    <rect x="27" y="33" width="46" height="46" rx="10.5" fill="#244F59"/>
    <rect x="34.5" y="42" width="31" height="31" rx="7" fill="#032C34"/>
    <rect x="41" y="50" width="18" height="18" rx="4" fill="#001318"/>
  </g>
</svg>
