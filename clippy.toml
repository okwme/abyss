too-many-lines-threshold = 70
# Flag every bool parameter: use a two-variant enum or two methods instead.
max-fn-params-bools = 0
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
# Product names used in docs; ".." keeps clippy's defaults (e.g. "MacOS").
doc-valid-idents = ["SQLCipher", "CommonCrypto", ".."]
