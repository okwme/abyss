[package]
name = "abyss-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
grammers-client.workspace = true
grammers-session.workspace = true
grammers-mtsender.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rusqlite = { version = "0.43", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
getrandom = "0.4"
zeroize = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain (plan section 3). `security-framework` for error messages, `-sys` for
# the `SecItem*` calls; the constants are declared in `secret/keychain.rs`.
security-framework = "3.7"
security-framework-sys = "2.17"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"

[lints]
workspace = true

[features]
# In-process fake backend for development and tests. Never enabled in release builds.
fake = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1.54", features = ["test-util", "macros", "rt"] }
